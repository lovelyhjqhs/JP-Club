traMsg": "", "svgIdx": 0}, {"id": 811, "name": "SSS 配音社", "cat": "文化", "tags": [], "desc": "", "fullIntro": "", "keywords": [], "extraMsg": "", "svgIdx": 0}, {"id": 812, "name": "VOJP 阿卡贝拉社", "cat": "文化", "tags": [], "desc": "", "fullIntro": "", "keywords": [], "extraMsg": "", "svgIdx": 0}, {"id": 813, "name": "钢琴西乐社", "cat": "文化", "tags": [], "desc": "", "fullIntro": "", "keywords": [], "extraMsg": "", "svgIdx": 0}, {"id": 814, "name": "即兴造物社", "cat": "文化", "tags": [], "desc": "即兴造物社成立于2026年3月，走工程实践与人文创意双向融合的发展路线，秉持“心中所想，就要实现”的宗旨，鼓励放开思路、大胆试错。", "fullIntro": "即兴造物社成立于2026年3月，是一支朝气蓬勃的新生社团。虽然社团尚且年轻，但我们已经搭建起完整的活动框架，形成了轻松包容的活动氛围，没有刻板的要求与压力，鼓励大家放开思路、大胆试错，不必害怕想法不成熟或是作品不完美。\n我们跳出单一的社团定位，走工程实践与人文创意双向融合的发展路线，不只是纯粹的理科搭建社团，也不是单纯的文艺手作社团。在工程板块，我们围绕DI目的地想象赛事开展训练，进行桥梁、弹珠传动轨道、承重高塔等结构搭建，探索力学原理，锻炼临场解题、团队协作的能力；在人文创意板块，我们开设钩织手作、即兴剧本创作、舞台表演等活动，用手工与表达释放想象力，为造物赋予温度。\n理性搭建骨架，感性注入灵魂。在这里，无论你擅长理科构思，还是热爱文艺创作，都能找到属于自己的一方天地。我们秉持“心中所想，就要实现”的宗旨，希望每一位社员都能跳出应试思维的桎梏，把脑海里天马行空的构想，亲手变为看得见、摸得着的实物。", "keywords": [], "extraMsg": "愿你在这里挣脱固有答案的束缚，以工程的理性构筑支撑，以人文的想象丰盈内核。不必畏惧试错，不必苛求完美。保持好奇，大胆创造，让每一个奇思妙想都拥有落地生根的机会，在动手造物的过程中，看见自己创意的无限潜能。", "svgIdx": 0}, {"id": 815, "name": "坚决不做马斯狗社", "cat": "文化", "tags": [], "desc": "", "fullIntro": "", "keywords": [], "extraMsg": "", "svgIdx": 0}, {"id": 816, "name": "建平电影社", "cat": "文化", "tags": [], "desc": "", "fullIntro": "", "keywords": [], "extraMsg": "", "svgIdx": 0}, {"id": 817, "name": "建平乒协", "cat": "文化", "tags": [], "desc": "建平乒协汇聚了一群热爱乒乓球的同学。无论球技如何，只要心怀感兴趣都欢迎加入，银球跃动、挥拍逐热，在小球的旋转里找到热爱。", "fullIntro": "建平乒协汇聚了一群热爱乒乓球的同学。无论球技如何，只要心怀感兴趣，都欢迎加入我们。银球跃动，挥拍逐热，建平乒协的每一位社员，都能在小球的旋转里找到热爱。平日里我们和水平相近的伙伴一同训练、切磋球技，在伙伴的陪伴中收获成长，在切磋之中精进球技，释放压力。表现突出、尤为热爱的同学可以选拔进入校乒乓球队，并肩协作，代表学校外出参赛。在这里不仅能够磨炼球技、强健体魄，还可以结识意气相投的伙伴，找到合拍的球搭子。秉持“球不落地，永不放弃”的精神，我们期待与你相遇！", "keywords": [], "extraMsg": "愿大家在这里尽情挥洒活力，提升球技，收获伙伴，真切感受乒乓球带来的乐趣。会有极其热情的毕业学长随机掉落，与大家交流切磋哦。愿同学们在球台前学会专注，在输赢之中懂得从容，怀揣这份热爱奔赴每一回合。建平乒协，因你而转。", "svgIdx": 0}, {"id": 818, "name": "建平围棋社 JPGO", "cat": "文化", "tags": [], "desc": "", "fullIntro": "", "ke var showingAll = false;
var svgCounter = 0;
var lastRendered = null;

function getSvg(idx) {
  var theme = svgThemes[idx % svgThemes.length];
  var uid = "g" + (svgCounter++);
  return theme.replace(/id="g\d"/g, 'id="' + uid + '"').replace(/url\(#g\d\)/g, 'url(#' + uid + ')');
}

function renderClubs(list) {
  var grid = document.getElementById("clubGrid");
  lastRendered = list;
  if (!list || !list.length) {
    grid.innerHTML = "<div class=\"no-results\"><p>" + siteT("club.none") + "</p></div>";
    return;
  }
  grid.innerHTML = list.map(function(c, i) {
    return "<div class=\"club-card\" onclick=\"openModal(" + c.id + ")\">" +
      "<div class=\"card-img\">" + (c.img ? "<img src=\"" + c.img + "\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">" : getSvg(c.svgIdx)) +
      "<div class=\"card-overlay\"></div><div class=\"card-badge\">" + c.cat + "</div></div>" +
      "<div class=\"card-body\"><h3>" + c.name + "</h3>" +
      "<div class=\"card-status\">" + siteT("club.status") + "</div>" +
      "<div class=\"card-desc\">" + (c.desc || siteT("club.prep")) + "…</div></div></div>";
  }).join("");
}

function applyDisplay(list) {
  if (list.length <= 12 || showingAll) { renderClubs(list); }
  else { renderClubs(list.slice(0, 12)); }
  document.getElementById("loadMoreWrap").style.display = list.length > 12 ? "" : "none";
}

  showingAll = false;
  document.getElementById("loadMoreLabel").textContent = siteT("club.more");
  document.getElementById("loadMoreArrow").textContent = "↓";
  if (!query) {
    applyDisplay(allClubs);
    return;
  }
  var results = allClubs.filter(function(c) {
    var haystack = [c.name, c.cat, c.desc, c.fullIntro, c.extraMsg].join(" ").toLowerCase();
    if (c.tags) haystack += " " + c.tags.join(" ");
    if (c.keywords) haystack += " " + c.keywords.join(" ");
    return haystack.indexOf(query) >= 0;
  });
  renderClubs(results.length ? results : null);
  document.getElementById("loadMoreWrap").style.display = "none";
}

function toggleLoadMore() {
  showingAll = !showingAll;
  var btn = document.getElementById("loadMoreLabel");
  var arrow = document.getElementById("loadMoreArrow");
  btn.textContent = showingAll ? siteT("club.collapse") : siteT("club.more");
  arrow.textContent = showingAll ? "↑" : "↓";
  applyDisplay(allClubs);
}

function openModal(id) {
  var c = allClubs.find(function(x) { return x.id === id; });
  if (!c) return;
  document.getElementById("modalTitle").textContent = c.name;
  var tagsEl = document.getElementById("modalTags");
  tagsEl.innerHTML = c.tags.map(function(t) { return "<span>" + t + "</span>"; }).join("");

  var poster = document.getElementById("modalPoster");
  var gradients = { "艺术": "linear-gradient(135deg,#7700e2,#a24bf0)", "科技": "linear-gradient(135deg,#0098e2,#00d1e2)", "体育": "linear-gradient(135deg,#00a312,#00e21d)", "文化": "linear-gradient(135deg,#0060e2,#0098e2)" };
  if (c.img) {
    poster.style.backgroundImage = "url('" + c.img + "')";
    poster.style.backgroundSize = "cover";
    poster.style.backgroundPosition = "center";
  } else {
    poster.style.backgroundImage = gradients[c.cat] || "linear-gradient(135deg,#0060e2,#0098e2)";
  }

  var html = "";
  if (c.fullIntro) {
    html += "<div class=\"info-section\"><div class=\"info-label\">" + siteT("club.about") + "</div><p class=\"info-text\">" + c.fullIntro + "</p></div>";
  }

  if (c.extraMsg) {
    html += "<div class=\"join-message\"><p>" + c.extraMsg + "</p></div>";
  }
  if (c.img2) {
    html += "<div class=\"info-section\"><div class=\"info-label\">" + siteT("club.poster") + "</div><div class=\"modal-picture\"><img src=\"" + c.img2 + "\" alt=\"\"></div></div>";
  }
  if (c.contactImg) {
    html += "<div class=\"info-section\"><div class=\"info-label\">" + siteT("club.contact") + "</div><div class=\"modal-picture\"><img src=\"" + c.contactImg + "\" alt=\"\"></div></div>";
  }
  if (c.contact) {
    html += "<div class=\"info-section\"><div class=\"info-label\">" + (c.contactImg ? siteT("club.contactNote") : siteT("club.contact")) + "</div><p class=\"info-text\">" + c.contact + "</p></div>";
  }


  html += "<div class=\"modal-actions\"><button class=\"close-btn\" onclick=\"closeModal()\">" + siteT("club.close") + "</button></div>";

  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

applyDisplay(allClubs);

window.siteAfterLang = function () {
  renderClubs(lastRendered);
  document.getElementById("loadMoreLabel").textContent = showingAll ? siteT("club.collapse") : siteT("club.more");
};

(function(){
  function fromHash(){
    var m = (location.hash || "").match(/^#(\d+)$/);
    if (m) {
      var id = parseInt(m[1], 10);
      var c = allClubs.find(function(x){ return x.id === id; });
      if (c) { openModal(id); window.scrollTo(0,0); }
    }
  }
  fromHash();
  window.addEventListener("hashchange", fromHash);
})();
</script></body></html>
