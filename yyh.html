var currentTag = "";

var POSTER_TEXT = window.YYH_POSTER_TEXT || {};

function classTags(code) {
  return CLASS_TAGS[code] || [];
}

function posterText(code) {
  return POSTER_TEXT[code] || "";
}

function tagLabel(tag) {
  return siteLang() === "en" ? (TAG_EN[tag] || tag) : tag;
}

function renderTagChips() {
  var wrap = document.getElementById("yyhTags");
  if (!wrap) return;
  var html = "<button type=\"button\" class=\"yyh-chip-btn" + (currentTag === "" ? " active" : "") + "\" onclick=\"setTag('')\">" + siteT("yyh.allTags") + "</button>";
  YYH_TAGS.forEach(function(tag) {
    html += "<button type=\"button\" class=\"yyh-chip-btn" + (currentTag === tag ? " active" : "") + "\" onclick=\"setTag('" + tag + "')\">" + tagLabel(tag) + "</button>";
  });
  wrap.innerHTML = html;
}

function setTag(tag) {
  currentTag = tag;
  renderTagChips();
  applyYYH();
}

function yyhCard(c) {
  var cover = c.posters.length ? "<img loading=\"lazy\" src=\"" + c.posters[0] + "\" alt=\"" + c.code + "班 游园会海报\">" : "";
  var tags = classTags(c.code).map(function(t) { return "<span class=\"yyh-tag\">" + tagLabel(t) + "</span>"; }).join("");
  return "<div class=\"club-card\" onclick=\"openYYH('" + c.code + "')\">" +
    "<div class=\"card-img\">" + cover + "<div class=\"card-overlay\"></div>" +
    "<div class=\"yyh-chip\">" + c.gradeName + "</div><div class=\"card-badge\">" + c.code + "</div></div>" +
    "<div class=\"card-body\"><h3>" + (c.theme || (c.code + "班 游园会")) + "</h3>" +
    "<div class=\"card-status\">" + c.grade + " · " + c.cls + "</div>" +
    "<div class=\"card-desc\">" + c.desc + "</div>" +
    (tags ? "<div class=\"yyh-tag-row\">" + tags + "</div>" : "") + "</div></div>";
}

function yyhFiltered() {
  var sel = document.getElementById("yyhGrade");
  var inp = document.getElementById("yyhSearch");
  var grade = sel ? sel.value : "";
  var query = inp ? inp.value.trim().toLowerCase() : "";
  return CLASSES.filter(function(c) {
    if (grade && c.grade !== grade) return false;
    var tags = classTags(c.code);
    if (currentTag && tags.indexOf(currentTag) === -1) return false;
    if (!query) return true;
    var haystack = [c.code, c.grade, c.gradeName, c.cls, c.theme, c.desc, posterText(c.code)].concat(tags).concat(tags.map(tagLabel)).join(" ").toLowerCase();
    return haystack.indexOf(query) >= 0;
  });
}

function renderYYH(list) {
  var body = document.getElementById("yyhBody");
  var html = "";
  YYH_GRADES.forEach(function(g) {
    var items = list.filter(function(c) { return c.grade === g.grade; });
    if (!items.length) return;
    html += "<section class=\"yyh-grade\"><div class=\"yyh-grade-head\"><h2 class=\"yyh-grade-title\">" + g.title +
      "</h2><span class=\"yyh-grade-sub\">" + items.length + " / " + g.sub + "</span></div>" +
      "<div class=\"yyh-grid\">" + items.map(yyhCard).join("") + "</div></section>";
  });
  body.innerHTML = html || ("<div class=\"no-results\"><p>" + siteT("yyh.none") + "</p></div>");
  var count = document.getElementById("yyhCount");
  if (count) count.textContent = siteT("yyh.countPrefix") + list.length + siteT("yyh.countSuffix");
}

function applyYYH() {
  renderYYH(yyhFiltered());
}

function openYYH(code) {
  var c = null;
  CLASSES.forEach(function(x) { if (x.code === code) c = x; });
  if (!c) return;
  document.getElementById("modalTitle").textContent = c.code + "班 · " + (c.theme || siteT("nav.yyh"));
  document.getElementById("modalTags").innerHTML =
    "<span>" + c.grade + "</span><span>" + c.cls + "</span>" + (c.theme ? "<span>" + c.theme + "</span>" : "") +
    classTags(c.code).map(function(t) { return "<span>" + tagLabel(t) + "</span>"; }).join("");
  var poster = document.getElementById("modalPoster");
  if (c.posters.length) {
    poster.style.backgroundImage = "url('" + c.posters[0] + "')";
    poster.style.backgroundSize = "cover";
    poster.style.backgroundRepeat = "no-repeat";
    poster.style.backgroundPosition = "center";
  } else {
    poster.style.backgroundImage = "linear-gradient(135deg,#0060e2,#0098e2)";
  }
  var html = "";
  if (c.desc) {
    html += "<div class=\"info-section\"><div class=\"info-label\">" + siteT("yyh.highlights") + "</div><p class=\"info-text\">" + c.desc + "</p></div>";
  }
  if (c.posters.length) {
    html += "<div class=\"info-section\"><div class=\"info-label\">" + siteT("yyh.poster") + "</div>" +
      c.posters.map(function(p) { return "<div class=\"modal-picture\"><img src=\"" + p + "\" alt=\"" + c.code + "班游园会海报\"></div>"; }).join("") +
      "</div>";
  }
  html += "<div class=\"modal-actions\"><button class=\"close-btn\" onclick=\"closeYYH()\">" + siteT("yyh.close") + "</button></div>";
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeYYH() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

renderTagChips();
renderYYH(CLASSES);

window.siteAfterLang = function() {
  renderTagChips();
  renderYYH(yyhFiltered());
};

(function() {
  function fromHash() {
    var m = (location.hash || "").match(/^#(\d{4})$/);
    if (m && CLASSES.some(function(c) { return c.code === m[1]; })) {
      openYYH(m[1]);
      window.scrollTo(0, 0);
    }
  }
  fromHash();
  window.addEventListener("hashchange", fromHash);
})();
